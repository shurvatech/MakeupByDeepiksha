<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A2927"/>
      <stop offset="100%" stop-color="#241817"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C79E"/>
      <stop offset="50%" stop-color="#B99A72"/>
      <stop offset="100%" stop-color="#917551"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D2CC"/>
      <stop offset="100%" stop-color="#B98282"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Border -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.9"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#roseGrad)" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6,4"/>

  <!-- Decorative Corner Stars / Accent Dots -->
  <circle cx="256" cy="38" r="4" fill="url(#goldGrad)"/>
  <circle cx="256" cy="474" r="4" fill="url(#goldGrad)"/>
  <circle cx="38" cy="256" r="4" fill="url(#goldGrad)"/>
  <circle cx="474" cy="256" r="4" fill="url(#goldGrad)"/>

  <!-- Monogram Letter D -->
  <g filter="url(#shadow)">
    <text x="256" y="340" font-family="'Cormorant Garamond', 'Didot', 'Bodoni MT', 'Cinzel', serif" font-size="280" font-weight="600" font-style="italic" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-2">D</text>
  </g>

  <!-- Subtitle Tag -->
  <text x="256" y="405" font-family="'Jost', 'Montserrat', sans-serif" font-size="34" font-weight="500" fill="url(#roseGrad)" text-anchor="middle" letter-spacing="12">BRIDAL</text>
</svg>
